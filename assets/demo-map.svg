    <circle cx="39" cy="177" r="7" fill="#83b5cb"/><text x="58" y="182">全部思考</text>
    <circle cx="39" cy="245" r="7" fill="#83b5cb"/><text x="58" y="250">文学阅读</text>
    <circle cx="39" cy="313" r="7" fill="#d4be55"/><text x="58" y="318">物品与记忆</text>

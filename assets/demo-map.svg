  <text x="964" y="399" fill="#a8afa2" font-family="monospace" font-size="12">来源</text>
  <text x="964" y="426" fill="#eeeade" font-family="Arial, sans-serif" font-size="14">《雨天的旧书店》</text>
  <text x="964" y="449" fill="#a8afa2" font-family="Arial, sans-serif" font-size="12">虚构演示作品</text>
  <path d="M964 476H1187" stroke="#596157"/>
  <text x="964" y="510" fill="#a8afa2" font-family="monospace" font-size="12">相关节点</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#d9dbd0">
    <circle cx="974" cy="543" r="5" fill="#83b5cb"/><text x="990" y="548">坏收音机承载家庭记忆</text>
    <circle cx="974" cy="579" r="5" fill="#d4be55"/><text x="990" y="584">从物件细节理解人物关系</text>

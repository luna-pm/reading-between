    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#111613" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1240" height="760" rx="24" fill="#202622"/>

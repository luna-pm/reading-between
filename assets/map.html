<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>阅读之间 · 知识地图</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #202722;
      --sidebar: #252d29;
      --panel: #2a332f;
      --panel-raised: #303a34;
      --ink: #eeeade;
      --muted: #a6ada1;
      --line: #59645a;
      --grid: rgba(175, 184, 166, .14);
      --blue: #83b7c6;
      --yellow: #d8c34a;
      --orange: #f08059;
      --green: #8dbca4;
      --radius: 22px;
      font: 15px/1.6 Inter, "SF Pro Display", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: #151b18;
      color: var(--ink);
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; min-width: 320px; background: #151b18; }
    button, input, textarea { font: inherit; }
    button { color: inherit; cursor: pointer; touch-action: manipulation; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--yellow); outline-offset: 3px; }
    [hidden] { display: none !important; }

    #reading-lab {
      max-width: 2040px;
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid #667064;
      border-radius: 28px 28px 18px 18px;
      background: var(--bg);
      color: var(--ink);
      box-shadow: 0 12px 45px rgba(0, 0, 0, .24);
    }
    .rs-top {
      min-height: 112px;
      display: flex;
      align-items: center;
      gap: 28px;
      padding: 24px 42px;
      border-bottom: 1px solid var(--line);
      background: #252d29;
    }
    .rs-logo {
      display: flex;
      align-items: center;
      gap: 18px;
      white-space: nowrap;
      font-size: clamp(24px, 2vw, 36px);
      font-weight: 680;
      letter-spacing: -.04em;
    }
    .rs-logo::before {
      content: "";
      width: 48px;
      height: 48px;
      border-radius: 5px;
      background: var(--orange);
      box-shadow: inset 0 0 0 13px var(--orange), inset 0 0 0 20px #fff0e5;
    }
    .rs-top-caption, .rs-kicker, .rs-side-foot, .rs-footer, .rs-demo-badge {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      letter-spacing: .09em;
    }
    .rs-top-caption { color: var(--muted); font-size: 14px; font-weight: 600; }
    .rs-demo-badge {
      margin-left: auto;
      color: var(--yellow);
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }
    .rs-shell {
      display: grid;
      grid-template-columns: clamp(190px, 15vw, 290px) minmax(0, 1fr) clamp(310px, 23vw, 440px);
      min-height: min(1000px, calc(100vh - 145px));
    }
    .rs-sidebar {
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 32px 26px 22px;
      border-right: 1px solid var(--line);
      background: var(--sidebar);
    }
    .rs-kicker { color: var(--muted); font-size: 13px; font-weight: 650; }
    .rs-sidebar > .rs-kicker { margin: 0 0 22px 8px; }
    .rs-topics { display: grid; gap: 7px; }
    .rs-topic {
      min-height: 72px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 16px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: transparent;
      text-align: left;
      font-size: 17px;
      font-weight: 550;
    }
    .rs-topic[aria-pressed="true"] { border-color: var(--orange); background: #39443c; }
    .rs-topic-dot { width: 18px; height: 18px; flex: 0 0 18px; border-radius: 50%; background: var(--topic-color, var(--blue)); }
    .rs-shelf { margin-top: 22px; padding: 24px 8px 0; border-top: 1px solid var(--line); }
    .rs-shelf-title { margin: 0 0 17px; color: var(--muted); font-size: 14px; }
    .rs-books { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 17px 12px; }
    .rs-book {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 9px;
      padding: 0;
      border: 0;
      background: transparent;
      text-align: left;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .rs-book[aria-pressed="true"] { color: var(--ink); }
    .rs-cover {
      position: relative;
      width: 82px;
      height: 118px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 9px 12px 14px;
      border-radius: 3px 6px 6px 3px;
      background: var(--cover-color, var(--yellow));
      box-shadow: inset 7px 0 0 rgba(255, 255, 255, .2), inset 12px 0 0 rgba(0, 0, 0, .12), 4px 5px 10px rgba(0, 0, 0, .22);
      color: #202722;
      text-align: center;
      font-weight: 700;
      letter-spacing: .04em;
      transition: transform .2s ease, outline-color .2s ease;
    }
    .rs-book:hover .rs-cover, .rs-book[aria-pressed="true"] .rs-cover { transform: translateY(-3px); outline: 2px solid var(--orange); outline-offset: 3px; }
    .rs-cover-title { max-height: 4.2em; overflow: hidden; }
    .rs-book-meta { max-width: 90px; }
    .rs-shelf-empty { color: var(--muted); font-size: 12px; }
    .rs-side-foot { margin-top: auto; padding: 26px 8px 0; color: var(--muted); font-size: 11px; line-height: 1.8; }
    .rs-main { min-width: 0; padding: 32px 28px 24px; }
    .rs-map-card {
      height: 100%;
      min-height: 760px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 25px;
      background-color: #202823;
    }
    .rs-main-head { padding: 29px 35px 0; }
    .rs-main-head h1 { margin: 8px 0 5px; font-size: clamp(25px, 2.2vw, 38px); line-height: 1.3; font-weight: 650; letter-spacing: -.025em; }
    .rs-desc { margin: 0; color: var(--muted); font-size: 16px; }
    .rs-toolbar { min-height: 54px; display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
    .rs-toolbar button, .live-controls button {
      min-height: 40px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      font-size: 12px;
    }
    .rs-toolbar button:hover, .live-controls button:hover { border-color: var(--blue); background: var(--panel-raised); }
    .rs-map {
      position: relative;
      flex: 1 1 auto;
      min-height: 640px;
      margin: 0 0 0;
      overflow: hidden;
      background-image: linear-gradient(to right, var(--grid) 1px, transparent 1px), linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
      background-size: 38px 38px;
      isolation: isolate;
    }
    .rs-map::before, .rs-map::after { content: ""; position: absolute; z-index: 0; top: 18px; bottom: 18px; width: 13px; opacity: .65; pointer-events: none; background: repeating-linear-gradient(to bottom, var(--muted) 0 1px, transparent 1px 10px); }
    .rs-map::before { left: 0; }
    .rs-map::after { right: 0; }
    .rs-map svg { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .rs-map path { fill: none; stroke: #889184; stroke-width: 1.7; }
    .rs-map path.rs-book-edge { stroke: var(--yellow); stroke-dasharray: 5 6; opacity: .5; }
    .rs-node {
      position: absolute;
      z-index: 2;
      width: clamp(150px, 18%, 225px);
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 0;
      border-radius: 4px;
      background: rgba(32, 39, 34, .93);
      text-align: center;
      line-height: 1.45;
      font-size: 17px;
      font-weight: 590;
      transition: opacity .18s ease, left .35s ease, top .35s ease, background .18s ease;
    }
    .rs-node:hover { background: var(--panel-raised); }
    .rs-node small { color: var(--muted); font-size: 13px; font-weight: 500; }
    .rs-node-mark { position: relative; width: 58px; height: 58px; display: block; border-radius: 50%; background: var(--blue); }
    .rs-node-mark::after { content: ""; position: absolute; inset: 17px; border-radius: 50%; background: var(--bg); }
    .rs-node[data-kind="method"] .rs-node-mark { width: 0; height: 0; border-radius: 0; border-left: 34px solid transparent; border-right: 34px solid transparent; border-bottom: 60px solid var(--yellow); background: transparent; }
    .rs-node[data-kind="method"] .rs-node-mark::after { display: none; }
    .rs-node[data-kind="insight"] .rs-node-mark { background: var(--green); }
    .rs-node[data-kind="example"] .rs-node-mark { width: 48px; height: 48px; border-radius: 5px; background: var(--orange); }
    .rs-node[data-kind="example"] .rs-node-mark::after { inset: 14px; border-radius: 2px; }
    .rs-node[data-kind="book"] .rs-node-mark { width: 42px; height: 56px; border-radius: 3px; background: var(--yellow); }
    .rs-node[data-kind="book"] .rs-node-mark::after { inset: 0 auto 0 8px; width: 5px; border-radius: 0; background: rgba(32, 39, 34, .2); }
    .rs-node.rs-core {
      width: clamp(250px, 31%, 360px);
      min-height: 188px;
      justify-content: center;
      gap: 10px;
      padding: 25px 28px;
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 14px;
      background: var(--yellow);
      color: #202722;
      box-shadow: 0 15px 35px rgba(0, 0, 0, .16);
      font-size: clamp(22px, 2vw, 31px);
      font-weight: 720;
    }
    .rs-node.rs-core:hover { background: #e0ce5c; }
    .rs-node.rs-core small { color: rgba(32, 39, 34, .76); }
    .rs-node.rs-core .rs-node-mark { display: none; }
    .rs-core-count { font-size: 14px; font-weight: 550; color: rgba(32, 39, 34, .78); }
    .rs-edge {
      position: absolute;
      z-index: 3;
      transform: translate(-50%, -50%);
      min-height: 32px;
      padding: 3px 8px;
      border: 0;
      border-radius: 4px;
      background: #202823;
      color: #c6cbbc;
      font-size: 13px;
      white-space: nowrap;
    }
    .rs-edge:hover { color: var(--yellow); background: var(--panel-raised); }
    .rs-update { display: flex; align-items: center; gap: 9px; padding: 12px 17px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    .rs-update-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
    .rs-list { padding: 24px; }
    .rs-list button { display: block; width: 100%; padding: 14px 16px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; }
    .rs-list small { display: block; margin-bottom: 5px; color: var(--muted); font-size: 11px; }
    .rs-info {
      min-width: 0;
      display: flex;
      flex-direction: column;
      margin: 32px 28px 32px 4px;
      padding: 34px 35px 25px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel);
    }
    .rs-info h2 { margin: 17px 0 0; font-size: clamp(23px, 2vw, 34px); line-height: 1.4; font-weight: 650; letter-spacing: -.025em; }
    .rs-type-pill { align-self: flex-start; margin-top: 19px; padding: 6px 14px; border-radius: 8px; background: #3b493c; color: var(--yellow); font-size: 13px; font-weight: 650; }
    .rs-detail-block { margin-top: 23px; padding-top: 22px; border-top: 1px solid var(--line); }
    .rs-detail-label { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
    .rs-info blockquote { margin: 0; font-size: 17px; line-height: 1.85; font-weight: 580; }
    .rs-quote-credit { margin-top: 10px; color: var(--muted); font-size: 11px; }
    .rs-info .rs-summary { margin: 15px 0 0; color: #d5d8cb; font-size: 13px; line-height: 1.85; white-space: pre-line; }
    .rs-source-card { display: flex; gap: 14px; align-items: center; margin: 8px 0; }
    .rs-source-mini-cover { width: 40px; height: 56px; flex: 0 0 40px; display: flex; align-items: center; justify-content: center; padding: 4px; border-radius: 2px; background: var(--yellow); color: #202722; text-align: center; font-size: 9px; line-height: 1.3; font-weight: 700; }
    .rs-source-title { font-size: 15px; font-weight: 600; }
    .rs-source-meta { margin-top: 4px; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .rs-source-link { display: inline-block; margin-top: 6px; color: var(--blue); font-size: 11px; text-decoration: none; }
    .rs-source-link:hover { text-decoration: underline; }
    .rs-related { display: grid; gap: 5px; }
    .rs-related button { display: flex; align-items: flex-start; gap: 12px; padding: 9px 0; border: 0; border-bottom: 1px solid rgba(89, 100, 90, .55); background: transparent; text-align: left; font-size: 13px; line-height: 1.55; }
    .rs-related button:hover { color: var(--yellow); }
    .rs-related-dot { width: 12px; height: 12px; flex: 0 0 12px; margin-top: 4px; border-radius: 50%; background: var(--blue); }
    .rs-related-dot[data-kind="method"] { border-radius: 0; background: var(--yellow); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
    .rs-related-dot[data-kind="insight"] { background: var(--green); }
    .rs-related-dot[data-kind="example"] { border-radius: 2px; background: var(--orange); }
    .rs-related-relation { display: block; color: var(--muted); font-size: 10px; }
    .rs-info-foot { margin-top: auto; padding-top: 28px; color: #899286; font: 11px/1.6 "SFMono-Regular", Consolas, monospace; letter-spacing: .06em; }
    .live-controls { display: flex; gap: 7px; flex-wrap: wrap; margin: 14px 0 0; }
    .rs-info input, .rs-info textarea { width: 100%; margin: 6px 0 12px; padding: 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--ink); font-size: 14px; }
    .rs-info textarea { min-height: 140px; resize: vertical; }
    .live-error { margin: 8px 20px; padding: 12px 14px; border: 1px solid var(--orange); color: #ffad8e; font-size: 12px; white-space: pre-wrap; }
    .empty { padding: 50px 25px; color: var(--muted); text-align: center; }
    .rs-footer { display: flex; justify-content: space-between; gap: 12px; padding: 11px 22px; border-top: 1px solid var(--line); background: #252d29; color: var(--muted); font-size: 10px; }

    @media (max-width: 1280px) {
      body { padding: 10px; }
      .rs-top { min-height: 94px; padding: 20px 28px; }
      .rs-shell { grid-template-columns: 175px minmax(0, 1fr) 300px; }
      .rs-sidebar { padding: 26px 16px 18px; }
      .rs-topic { min-height: 62px; padding: 10px 12px; font-size: 14px; }
      .rs-main { padding: 22px 18px; }
      .rs-map-card { min-height: 700px; }
      .rs-main-head { padding: 23px 25px 0; }
      .rs-info { margin: 22px 18px 22px 0; padding: 25px 22px 20px; }
    }
    @media (max-width: 980px) {
      .rs-shell { grid-template-columns: 165px minmax(0, 1fr); }
      .rs-info { grid-column: 1 / -1; margin: 0 18px 22px 183px; min-height: 400px; }
      .rs-side-foot { padding-top: 12px; }
      .rs-map-card { min-height: 700px; }
    }
    @media (max-width: 620px) {
      body { padding: 0; }
      #reading-lab { border-radius: 0; border-left: 0; border-right: 0; }
      .rs-top { position: relative; min-height: 84px; gap: 12px; padding: 17px 18px; flex-wrap: wrap; }
      .rs-logo { gap: 10px; font-size: 22px; }
      .rs-logo::before { width: 30px; height: 30px; box-shadow: inset 0 0 0 8px var(--orange), inset 0 0 0 13px #fff0e5; }
      .rs-top-caption { width: 100%; padding-left: 40px; font-size: 9px; }
      .rs-demo-badge { position: absolute; right: 15px; top: 20px; font-size: 9px; }
      .rs-shell { display: flex; flex-direction: column; }
      .rs-sidebar { padding: 15px 13px 13px; border-right: 0; border-bottom: 1px solid var(--line); }
      .rs-sidebar > .rs-kicker { margin: 0 0 9px 5px; font-size: 10px; }
      .rs-topics { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
      .rs-topic { min-height: 44px; gap: 8px; padding: 8px; border-radius: 8px; font-size: 11px; }
      .rs-topic-dot { width: 12px; height: 12px; flex-basis: 12px; }
      .rs-shelf { margin-top: 13px; padding: 13px 5px 0; }
      .rs-shelf-title { margin-bottom: 10px; font-size: 11px; }
      .rs-books { grid-template-columns: repeat(auto-fill, 66px); gap: 10px; }
      .rs-cover { width: 54px; height: 76px; font-size: 10px; }
      .rs-book { font-size: 9px; }
      .rs-book-meta { max-width: 64px; }
      .rs-side-foot { display: none; }
      .rs-main { padding: 13px 10px; }
      .rs-map-card { min-height: 0; border-radius: 16px; }
      .rs-main-head { padding: 17px 17px 0; }
      .rs-kicker { font-size: 10px; }
      .rs-main-head h1 { font-size: 22px; }
      .rs-desc { font-size: 12px; }
      .rs-toolbar { min-height: 40px; margin-top: 6px; }
      .rs-toolbar button { min-height: 34px; padding: 5px 8px; font-size: 10px; }
      .rs-map { min-height: 750px; background-size: 28px 28px; }
      .rs-node { width: 132px; gap: 5px; padding: 6px 5px; font-size: 12px; }
      .rs-node small { font-size: 10px; }
      .rs-node-mark { width: 40px; height: 40px; }
      .rs-node-mark::after { inset: 12px; }
      .rs-node[data-kind="method"] .rs-node-mark { border-left-width: 23px; border-right-width: 23px; border-bottom-width: 41px; }
      .rs-node.rs-core { width: 196px; min-height: 126px; padding: 15px 16px; border-radius: 11px; font-size: 19px; }
      .rs-core-count { font-size: 11px; }
      .rs-edge { min-height: 25px; padding: 2px 5px; font-size: 9px; }
      .rs-update { padding: 9px 12px; font-size: 9px; }
      .rs-info { margin: 0 10px 14px; padding: 22px 18px 17px; border-radius: 16px; }
      .rs-info h2 { margin-top: 12px; font-size: 23px; }
      .rs-type-pill { margin-top: 14px; font-size: 11px; }
      .rs-detail-block { margin-top: 17px; padding-top: 16px; }
      .rs-detail-label { font-size: 11px; }
      .rs-info blockquote { font-size: 15px; }
      .rs-info .rs-summary { font-size: 12px; }
      .rs-footer { padding: 9px 12px; font-size: 8px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div id="reading-lab">
    <header class="rs-top">
      <div class="rs-logo">阅读之间</div>
      <div class="rs-top-caption">READING / THINKING / CONNECTIONS</div>
      <div class="rs-demo-badge" id="demo-badge" hidden>FICTIONAL DEMO</div>
    </header>
    <div class="rs-shell">
      <aside class="rs-sidebar" aria-label="主题与书架">
        <div class="rs-kicker">主题 / CHANNELS</div>
        <nav class="rs-topics" aria-label="知识主题"></nav>
        <section class="rs-shelf" aria-label="书架">
          <p class="rs-shelf-title">书架 / BOOKSHELF</p>
          <div class="rs-books"></div>
        </section>
        <div class="rs-side-foot">PERSONAL ARCHIVE<br><span id="connection-state">正在连接知识库…</span></div>
      </aside>

      <main class="rs-main">
        <section class="rs-map-card" aria-label="知识关系地图">
          <div class="rs-main-head">
            <div class="rs-kicker">知识地图 / CONNECTION MAP</div>
            <h1 id="map-title">思考正在这里相遇</h1>
            <p class="rs-desc" id="map-description">围绕一段阅读，留下可追溯的想法与关联。</p>
            <div class="rs-toolbar live-controls">
              <button id="view-toggle" type="button">节点列表</button>
              <button id="refresh" type="button">刷新</button>
              <button id="undo" type="button" hidden>撤销上次修改</button>
            </div>
          </div>
          <div class="rs-map" aria-label="知识关系图">
            <svg aria-hidden="true"></svg>
            <div class="empty">等待连接知识库…</div>
          </div>
          <div class="rs-list" hidden></div>
          <div class="rs-update" aria-live="polite"><span class="rs-update-dot"></span><span>等待连接知识库…</span></div>
        </section>
      </main>

      <aside class="rs-info" aria-label="节点详情" aria-live="polite">
        <div class="rs-kicker">节点详情 / DETAIL</div>
        <div class="rs-type-pill">思考节点</div>
        <h2>从一次阅读对话开始</h2>
        <p class="rs-summary">在启用插件的对话里正常讨论，保存后就能在这里展开思考与关联。</p>
      </aside>
    </div>
    <div id="live-error" class="live-error" role="alert" hidden></div>
    <div class="live-controls" style="padding:0 20px 10px"><button id="retry" type="button" hidden>重试上次操作</button></div>
    <footer class="rs-footer"><span>NODE / 原文与想法　 ·　 LINK / 关联依据</span><span id="revision-state">尚未连接存储</span></footer>
  </div>

  <script>
  (() => {
    'use strict';

    const DEMO_GRAPH = {
      revision: 12,
      recent_changes: [],
      nodes: [
        {
          id: 'objects-memory', title: '物品与记忆', body: '旧物在故事里既承载日常功能，也保存人与过往之间的关系。读到物品时，可以继续追问：它属于谁、为何留下、作者为什么在此刻写到它？',
          kind: 'concept', attribution: 'user', status: 'accepted', quote: '搬家时，坚持带走那台早已坏掉的收音机。', quote_attribution: 'external',
          topics: ['文学阅读', '物品与记忆'], archived: false,

      list.querySelectorAll('[data-note]').forEach(button => button.addEventListener('click', () => choose(button.dataset.note)));
      root.querySelector('#view-toggle').textContent = listMode ? '关系地图' : '节点列表';
      root.querySelector('#connection-state').textContent = demoMode ? '虚构演示 · 未连接真实库' : ready ? '已连接' : '正在连接知识库…';
      root.querySelector('#revision-state').textContent = demoMode ? 'FICTIONAL DATA · UI CONCEPT' : graph.revision >= 0 ? `已读取存储 · 修订 ${graph.revision}` : '尚未连接存储';
      root.querySelector('#demo-badge').hidden = !demoMode;
      root.querySelector('#undo').hidden = demoMode || !graph.recent_changes?.[0] || graph.recent_changes[0].action === 'undo';
      root.querySelector('#refresh').hidden = demoMode;
      root.querySelector('#retry').hidden = demoMode || !pendingMutation;
      const latest = graph.recent_changes?.[0];
      root.querySelector('.rs-update span:last-child').textContent = demoMode ? '虚构演示数据 · 不会写入个人知识库' : latest ? `最近更新 · ${latest.summary?.added_nodes?.length || 0} 条新增 · ${new Date(latest.created_at).toLocaleString()}` : '等待下一次阅读思考';
      detail();
      if (!listMode) draw();
    }

    root.querySelector('#view-toggle').addEventListener('click', () => { listMode = !listMode; render(); });
    root.querySelector('#refresh').addEventListener('click', () => call('get_knowledge_map', {}).catch(issue => error(issue.message)));
    root.querySelector('#undo').addEventListener('click', () => {
      const latest = graph.recent_changes?.[0];
      if (latest) mutate('undo_reading_change', { change_id: latest.id });
    });
    root.querySelector('#retry').addEventListener('click', () => {
      if (pendingMutation) mutate(pendingMutation.name, pendingMutation.args, true);
    });
    if ('ResizeObserver' in window) new ResizeObserver(() => { if (!listMode) draw(); }).observe(map);
    else window.addEventListener('resize', () => { if (!listMode) draw(); });

    if (demoMode) {
      render();
    } else {
      (async () => {
        try {
          await request('ui/initialize', { appInfo: { name: 'reading-between', version: '0.2.0' }, appCapabilities: {}, protocolVersion: '2026-01-26' });
          ready = true;
          notify('ui/notifications/initialized', {});
          await call('get_knowledge_map', {});
        } catch (issue) {
          root.querySelector('#connection-state').textContent = '未连接';
          error(issue.message);
        }
      })();
    }
  })();
  </script>
</body>
</html>

<header class="rs-top"><div class="rs-logo">阅读之间</div><div class="rs-top-caption">READING / THINKING / CONNECTIONS</div></header>
<div class="rs-shell"><aside class="rs-sidebar"><div class="rs-kicker">主题 / CHANNELS</div><nav class="rs-topics" aria-label="知识主题"></nav><div class="rs-side-foot">PERSONAL ARCHIVE<br><span id="connection-state">正在连接知识库…</span></div></aside>
<main class="rs-main"><div class="rs-main-head"><div class="rs-kicker">知识地图 / CONNECTION MAP</div><h2 id="map-title">思考正在这里相遇</h2><p class="rs-desc" id="map-description">保留原话、来源，以及后来发生的变化。</p><div class="live-controls"><button id="view-toggle" type="button">节点列表</button><button id="refresh" type="button">刷新</button><button id="undo" type="button" hidden>撤销上次修改</button></div></div><div class="rs-map" aria-label="知识关系地图"><svg aria-hidden="true"></svg><div class="empty">等待连接。这里不会预填虚构的个人知识。</div></div><div class="live-list" hidden></div><div class="rs-update" aria-live="polite">暂无更新</div></main>
<aside class="rs-info" aria-label="节点详情" aria-live="polite"><div class="rs-kicker">原话 / SOURCE</div><h3>从一次阅读对话开始</h3><p>在启用插件的对话里正常讨论，保存后就能在这里展开思考与关联。</p></aside></div>
<div id="live-error" class="live-error" role="alert" hidden></div><div class="live-controls" style="padding:0 20px"><button id="retry" type="button" hidden>重试上次操作</button></div>
<footer class="rs-footer"><span>NODE / 原话　 ·　 LINK / 关联依据</span><span id="revision-state">尚未连接存储</span></footer></div>
<script>
(function(){
'use strict';
const root=document.getElementById('reading-lab'),map=root.querySelector('.rs-map'),svg=map.querySelector('svg'),info=root.querySelector('.rs-info'),pending=new Map();let graph={nodes:[],edges:[],revision:-1,recent_changes:[]},focus=null,topic='',listMode=false,rpcId=0,ready=false,busy=false,pendingMutation=null;
const labels={book:'作品',concept:'概念',insight:'你的思考',method:'方法',question:'开放问题',example:'具体例子'},relations={origin:'来自',analogy:'类比',supports:'支持',extends:'补充',challenges:'质疑',revises:'修正',example:'举例',applies:'应用',part_of:'组成'},authors={user:'你的表达',ai:'AI 解释',external:'外部知识'},states={open:'未定论',proposed:'待讨论',accepted:'你已认可',verified:'有外部核验来源'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function error(s){const e=root.querySelector('#live-error');e.textContent=s||'';e.hidden=!s;}
function notify(method,params){window.parent.postMessage({jsonrpc:'2.0',method,params},'*');}
function request(method,params){return new Promise((resolve,reject)=>{const id=++rpcId;const timer=setTimeout(()=>{pending.delete(id);reject(new Error('连接超时；写入结果可能尚未返回。请重试上次操作，不要重复创建。'));},15000);pending.set(id,{resolve,reject,timer});window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');});}
window.addEventListener('message',event=>{if(event.source!==window.parent)return;const m=event.data;if(!m||m.jsonrpc!=='2.0')return;if(m.id!==undefined){const p=pending.get(m.id);if(!p)return;clearTimeout(p.timer);pending.delete(m.id);m.error?p.reject(new Error(m.error.message||'宿主调用失败')):p.resolve(m.result);}else if(m.method==='ui/notifications/tool-result'){receive(m.params);}});
function receive(response){if(response?.isError)return;const content=response?.structuredContent;if(content?.graph&&Number.isInteger(content.graph.revision)&&content.graph.revision>=graph.revision){graph=content.graph;if(!graph.nodes.some(n=>n.id===focus))focus=graph.nodes.find(n=>n.kind==='insight')?.id||graph.nodes[0]?.id||null;render();}}
async function call(name,args){if(!ready)throw new Error('知识库尚未连接。请从已连接的插件中打开地图。');const r=await request('tools/call',{name,arguments:args});if(r.isError){const e=new Error(r.content?.filter(c=>c.type==='text').map(c=>c.text).join(' ')||'操作失败');e.definitive=true;throw e;}receive(r);return r;}
async function mutate(name,args,retry=false){if(busy)return;if(pendingMutation&&!retry){error('上次操作的结果尚未确认，请先重试上次操作。');return;}busy=true;error('');const op=pendingMutation||{name,args:{...args,request_id:crypto.randomUUID(),expected_revision:graph.revision}};pendingMutation=op;root.querySelector('#retry').hidden=true;try{await call(op.name,op.args);pendingMutation=null;}catch(e){error(e.message+(e.definitive?' 请刷新后检查内容再操作。':''));if(e.definitive)pendingMutation=null;root.querySelector('#retry').hidden=!pendingMutation;}finally{busy=false;}}
function selected(){return graph.nodes.find(n=>n.id===focus);}
function filtered(){return graph.nodes.filter(n=>!topic||(n.topics||[]).includes(topic));}
function choose(id){focus=id;const n=selected();if(topic&&!(n?.topics||[]).includes(topic))topic='';render();}
function detail(){const n=selected();if(!n){info.innerHTML='<div><div class="rs-kicker">原话 / SOURCE</div><h3>还没有选中的思考</h3><p>保存后，内容与来源会出现在这里。</p></div>';return;}const linked=graph.edges.filter(e=>e.source===focus||e.target===focus);info.innerHTML='<div><div class="rs-kicker">'+esc(authors[n.attribution])+' / '+esc(states[n.status])+'</div><h3>'+esc(n.title)+'</h3>'+(n.quote?'<blockquote>「'+esc(n.quote)+'」<small style="display:block;font:11px system-ui;margin-top:8px">'+esc(authors[n.quote_attribution||n.attribution])+'</small></blockquote>':'')+'<p>'+esc(n.body)+'</p><div class="live-controls"><button type="button" id="edit-node">编辑整理</button><button type="button" id="archive-node">移出地图</button></div></div><div class="rs-section"><div class="rs-kicker">关联 / CONNECTIONS</div><div class="rs-related">'+linked.map(e=>{const other=graph.nodes.find(x=>x.id===(e.source===focus?e.target:e.source));return other?'<button type="button" data-link="'+esc(e.id)+'">'+esc(relations[e.relation])+' · '+esc(other.title)+' ↗</button>':'';}).join('')+'</div><div class="rs-section"><div class="rs-kicker">来源 / PROVENANCE</div>'+n.sources.map(s=>'<p>'+esc(s.label)+'</p>'+(s.url?'<a class="rs-source" target="_blank" rel="noopener noreferrer" href="'+esc(s.url)+'">查看原对话或资料 ↗</a>':'')).join('')+'</div></div>';info.querySelector('#edit-node').onclick=edit;info.querySelector('#archive-node').onclick=()=>mutate('archive_reading_node',{node_id:n.id});info.querySelectorAll('[data-link]').forEach(b=>b.onclick=()=>edgeDetail(graph.edges.find(e=>e.id===b.dataset.link)));}
function edgeDetail(e){if(!e)return;const a=graph.nodes.find(n=>n.id===e.source),b=graph.nodes.find(n=>n.id===e.target);info.innerHTML='<div><div class="rs-kicker">关联依据 / '+esc(relations[e.relation])+'</div><h3>'+esc(a?.title)+' → '+esc(b?.title)+'</h3><p>'+esc(e.reason)+'</p><p>'+esc(authors[e.attribution])+'</p></div><div class="rs-section"><div class="rs-kicker">沿着关联继续</div><div class="rs-related"><button data-to="'+esc(e.source)+'" type="button">'+esc(a?.title)+' ↗</button><button data-to="'+esc(e.target)+'" type="button">'+esc(b?.title)+' ↗</button></div></div>';info.querySelectorAll('[data-to]').forEach(el=>el.onclick=()=>choose(el.dataset.to));}
function edit(){const n=selected();info.innerHTML='<form id="edit-form"><div class="rs-kicker">编辑整理 / EDIT</div><h3>原话与来源会保留</h3><label>标题<input name="title" maxlength="200" required></label><label>整理后的内容<textarea name="body" maxlength="12000" required></textarea></label><div class="live-controls"><button type="submit">保存</button><button id="cancel-edit" type="button">取消</button></div></form>';const f=info.querySelector('form');f.elements.title.value=n.title;f.elements.body.value=n.body;info.querySelector('#cancel-edit').onclick=detail;f.onsubmit=async e=>{e.preventDefault();await mutate('revise_reading_node',{node_id:n.id,title:f.elements.title.value,body:f.elements.body.value,status:n.status});};}
function draw(){svg.innerHTML='';map.querySelectorAll('button,.empty').forEach(e=>e.remove());const n=selected();if(!n){const e=document.createElement('div');e.className='empty';e.textContent=ready?'这里还没有保存的思考。继续阅读讨论，地图会从第一条记录开始。':'请从插件中打开地图，以连接真实知识库。';map.appendChild(e);return;}
const w=map.clientWidth,narrow=w<390;const neighbors=graph.edges.filter(e=>e.source===focus||e.target===focus).map(e=>e.source===focus?e.target:e.source);const ids=[focus,...Array.from(new Set(neighbors)).filter(id=>id!==focus).slice(0,6)];const count=ids.length-1;const height=narrow?Math.max(270,200+Math.ceil(count/2)*155):Math.max(330,count>4?545:430);map.style.height=height+'px';svg.setAttribute('viewBox','0 0 '+w+' '+height);const pos={[focus]:[w*.5,narrow?85:205]};const slots=narrow?[[.24,243],[.76,243],[.24,398],[.76,398],[.24,553],[.76,553]]:[[.22,65],[.78,65],[.22,355],[.78,355],[.22,495],[.78,495]];ids.slice(1).forEach((id,i)=>pos[id]=[w*slots[i][0],slots[i][1]]);const shownEdges=graph.edges.filter(e=>pos[e.source]&&pos[e.target]);for(const e of shownEdges){const a=pos[e.source],b=pos[e.target],my=(a[1]+b[1])/2;const path=document.createElementNS('http://www.w3.org/2000/svg','path');const i=ids.indexOf(e.source===focus?e.target:e.source)-1;const lower=narrow&&i>=2&&i<4&&(e.source===focus||e.target===focus);path.setAttribute('d',lower?'M '+pos[focus][0]+' '+pos[focus][1]+' L '+w*.5+' 285 Q '+w*.5+' 330 '+pos[ids[i+1]][0]+' '+pos[ids[i+1]][1]:'M '+a[0]+' '+a[1]+' C '+a[0]+' '+my+', '+b[0]+' '+my+', '+b[0]+' '+b[1]);svg.appendChild(path);const bt=document.createElement('button');bt.className='rs-edge';bt.type='button';bt.textContent=relations[e.relation];bt.setAttribute('aria-label','查看关联：'+bt.textContent);bt.style.left=(a[0]+b[0])/2+'px';bt.style.top=(lower?324:!narrow&&my<200?118:!narrow&&my<400?295:my)+'px';bt.onclick=()=>edgeDetail(e);map.appendChild(bt);}
for(const id of ids){const item=graph.nodes.find(x=>x.id===id);if(!item)continue;const b=document.createElement('button');b.type='button';b.className='rs-node'+(id===focus?' rs-core':'');b.dataset.kind=item.kind==='book'?'book':item.kind==='method'?'method':item.kind==='insight'?'thought':'concept';b.setAttribute('aria-pressed',String(id===focus));b.innerHTML=(id===focus?'':'<span class="rs-marker" aria-hidden="true"></span>')+'<small>'+esc(labels[item.kind])+'</small>'+esc(item.title);b.style.left=pos[id][0]+'px';b.style.top=pos[id][1]+'px';b.onclick=()=>choose(id);map.appendChild(b);}}
function render(){const topics=Array.from(new Set(graph.nodes.flatMap(n=>n.topics||[])));const nav=root.querySelector('.rs-topics');nav.innerHTML=['',...topics].map(t=>'<button class="rs-topic" type="button" data-topic="'+esc(t)+'" aria-pressed="'+String(t===topic)+'"><span class="rs-seed"></span>'+esc(t||'全部思考')+'</button>').join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{topic=b.dataset.topic;focus=filtered()[0]?.id||null;render();});root.querySelector('#map-title').textContent=selected()?.title||'思考正在这里相遇';root.querySelector('#map-description').textContent=topic||'以当前思考为中心，展开它的直接关联。';const list=root.querySelector('.live-list');list.hidden=!listMode;map.hidden=listMode;list.innerHTML=filtered().map(n=>'<button data-note="'+esc(n.id)+'" type="button"><small>'+esc(authors[n.attribution])+' / '+esc(states[n.status])+'</small>'+esc(n.title)+'</button>').join('');list.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>choose(b.dataset.note));root.querySelector('#revision-state').textContent='已读取存储 · 修订 '+graph.revision;root.querySelector('#connection-state').textContent=ready?'已连接':'快照';const last=graph.recent_changes[0];root.querySelector('.rs-update').textContent=last?'最近更新 / '+last.action+' · '+new Date(last.created_at).toLocaleString():'尚无更新记录';const undo=root.querySelector('#undo');undo.hidden=!last||last.action==='undo';draw();detail();}
root.querySelector('#view-toggle').onclick=()=>{listMode=!listMode;root.querySelector('#view-toggle').textContent=listMode?'知识地图':'节点列表';render();};root.querySelector('#refresh').onclick=()=>call('get_knowledge_map',{}).catch(e=>error(e.message));root.querySelector('#undo').onclick=()=>{const last=graph.recent_changes[0];if(last)mutate('undo_reading_change',{change_id:last.id});};root.querySelector('#retry').onclick=()=>{if(pendingMutation)mutate(pendingMutation.name,pendingMutation.args,true);};new ResizeObserver(()=>{if(!listMode)draw();}).observe(map);
(async()=>{if(window.parent===window){error('这是插件界面文件，需要在已连接的 ChatGPT 插件内打开。当前不会保存任何数据。');return;}try{await request('ui/initialize',{appInfo:{name:'reading-between',version:'0.1.0'},appCapabilities:{},protocolVersion:'2026-01-26'});ready=true;notify('ui/notifications/initialized',{});await call('get_knowledge_map',{});}catch(e){root.querySelector('#connection-state').textContent='未连接';error(e.message);}})();
})();
</script></body></html>
